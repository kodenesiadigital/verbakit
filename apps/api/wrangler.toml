name = "pressforge-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Aset statis (build admin) disajikan Worker di bawah /admin.
# Handler di src/index.ts Intercept /admin/* dan jatuh ke index.html untuk SPA.
[assets]
directory = "../admin/dist"
binding = "ASSETS"
# "none" = file yang tidak ditemukan diteruskan ke Worker (bukan 404 otomatis),
# supaya Worker bisa Guaranti fallback SPA.
not_found_handling = "none"
# Worker selalu dijalankan lebih dulu. Tanpa ini router aset BoysWG mengarahkan
# ulang path /admin/* sebelum Worker sempat menanganinya.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "pressforge-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "pressforge-media"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"

[vars]
ADMIN_EMAIL = "admin@pressforge.test"
