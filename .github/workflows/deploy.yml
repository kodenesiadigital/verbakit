name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy ke Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Postinstall esbuild/workerd diizinkan lewat field `allowScripts` di
      # package.json, jadi tidak perlu flag tambahan di sini.
      # (Catatan: `npm config set allow-scripts` gagal di root workspace dengan
      # ENOWORKSPACES, jadi jangan dipakai.)
      - name: Install dependensi
        run: npm ci

      # typecheck + build registry paket + build admin. Admin wajib dibangun
      # lebih dulu karena blok [assets] pada wrangler.toml membaca
      # apps/admin/dist.
      - name: Build
        run: npm run build

      # Resource Cloudflare belum tentu dikonfigurasi di setiap fork/clone.
      # Tanpa guard, build pertama gagal dengan error yang membingungkan
      # (mis. "invalid database_id"). Lewati saja dengan peringatan.
      - name: Periksa konfigurasi deploy
        id: deploy
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1: ${{ secrets.D1_DATABASE_ID }}
          KV: ${{ secrets.KV_NAMESPACE_ID }}
          R2: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$D1" ] || [ -z "$KV" ] || [ -z "$R2" ]; then
            echo "::notice::Secret Cloudflare belum lengkap, deploy dilewati."
            echo "Isi CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID,"
            echo "KV_NAMESPACE_ID, dan R2_BUCKET_NAME di Settings > Secrets."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker
        if: steps.deploy.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # ID resource D1/KV/R2 ditulis lewat secrets agar wrangler.toml
          # bebas dari nilai khusus akun tertentu.
          d1DatabaseId: ${{ secrets.D1_DATABASE_ID }}
          kvNamespaceId: ${{ secrets.KV_NAMESPACE_ID }}
          r2BucketName: ${{ secrets.R2_BUCKET_NAME }}
          workingDirectory: apps/api
          command: deploy
